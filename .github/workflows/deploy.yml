name: Deploy Workshop Infra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Generate runtime config
        env:
          WS_SCRIPT_URL: ${{ secrets.WS_SCRIPT_URL || vars.WS_SCRIPT_URL }}
        run: |
          mkdir -p workshop-infra/frontend
          printf 'window.WS_RUNTIME_CONFIG = {\n  scriptUrl: "%s"\n};\n' "$WS_SCRIPT_URL" > workshop-infra/frontend/runtime-config.js
          if [ -z "$WS_SCRIPT_URL" ]; then
            echo "::warning::WS_SCRIPT_URL is empty — set it as a GitHub Secret or Variable"
          else
            echo "Generated runtime-config.js with URL: ${WS_SCRIPT_URL:0:50}..."
          fi

      - name: Copy slide deck
        run: |
          mkdir -p workshop-infra/frontend/slides
          cp workshops/slides/workshop-1-slides.html workshop-infra/frontend/slides/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workshop-infra/frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
