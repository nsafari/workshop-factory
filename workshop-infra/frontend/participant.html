<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارگاه آموزشی</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
  <div>
    <h1 id="workshopTitle">کارگاه آموزشی</h1>
    <div class="subtitle" id="workshopSubtitle">در حال بارگذاری...</div>
  </div>
  <div class="actions"></div>
</div>

<div class="container">
  <!-- پیشرفت -->
  <div class="progress-bar" id="progressBar" style="display: none;">
    <span class="progress-text">
      <strong id="answeredCount">0</strong> از <strong id="totalQuestions">0</strong> سؤال
    </span>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>
    <span class="progress-text" id="progressPercent">0%</span>
  </div>

  <!-- لیست بخش‌ها -->
  <div id="sectionsList">
    <div class="loading">
      <div class="spinner"></div>
      <p>در حال بارگذاری...</p>
    </div>
  </div>

  <!-- پایان -->
  <div class="all-done" id="allDone" style="display: none;">
    <div class="icon">🎉</div>
    <h2>کارگاه به پایان رسید</h2>
    <p>از مشارکت شما متشکریم!</p>
    <a class="survey-link" id="surveyLink" href="survey.html">📊 نظرسنجی پایانی</a>
  </div>
</div>

<script src="runtime-config.js?v=2"></script>
<script src="config.js?v=2"></script>
<script>
  // ============================================================
  //  متغیر‌ها
  // ============================================================
  let scriptUrl = '';
  let sections = [];
  let questions = [];
  let allAnswered = false;

  // ============================================================
  //  راه‌اندازی
  // ============================================================
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    scriptUrl = params.get('scriptUrl') || localStorage.getItem('ws_participant_script_url');
    
    if (!scriptUrl) {
      document.getElementById('sectionsList').innerHTML = 
        '<div class="loading"><p style="color: var(--danger);">⚠️ لینک نامعتبر. لطفاً لینک جدید از ارائه‌کننده دریافت کنید.</p></div>';
      return;
    }
    
    localStorage.setItem('ws_participant_script_url', scriptUrl);
    WorkshopConfig.scriptUrl = scriptUrl;
    loadData();
  });

  // ============================================================
  //  بارگذاری
  // ============================================================
  async function loadData() {
    try {
      const [sectionsData, questionsData, configData] = await Promise.all([
        API.get('sections'),
        API.get('questions'),
        API.get('config')
      ]);
      
      sections = sectionsData;
      questions = questionsData;
      
      // عنوان
      document.getElementById('workshopTitle').textContent = configData.config?.workshopTitle || 'کارگاه آموزشی';
      document.getElementById('workshopSubtitle').textContent = configData.spreadsheetName || '';
      
      renderSections();
      updateProgress();
      
    } catch (err) {
      document.getElementById('sectionsList').innerHTML = 
        '<div class="loading"><p style="color: var(--danger);">⚠️ خطا در بارگذاری: ' + err.message + '</p></div>';
    }
  }

  // ============================================================
  //  رندر بخش‌ها
  // ============================================================
  function renderSections() {
    const container = document.getElementById('sectionsList');
    
    // فقط بخش‌ها را نشان بده که سؤال دارند
    const sectionsWithQuestions = sections.filter(s => 
      questions.some(q => q.sectionId === s.id)
    );
    
    if (!sectionsWithQuestions.length) {
      container.innerHTML = '<div class="loading"><p>هنوز سؤالی فعال نشده. لطفاً صبر کنید...</p></div>';
      return;
    }
    
    container.innerHTML = sectionsWithQuestions.map(s => {
      const sectionQuestions = questions.filter(q => q.sectionId === s.id);
      const answeredQs = ProgressStore.getAnsweredQuestions(s.id);
      const allSectionAnswered = sectionQuestions.every(q => answeredQs[q.id]);
      
      if (s.active) {
        // بخش فعال
        return `
          <div class="section-card active" id="card-${s.id}">
            <div class="section-header">
              <span class="section-title">${UI.escapeHtml(s.title)}</span>
              <span class="section-status ${allSectionAnswered ? 'status-done' : 'status-active'}">
                ${allSectionAnswered ? '✓ انجام شد' : 'باز'}
              </span>
            </div>
            ${sectionQuestions.map(q => renderQuestion(q, s)).join('')}
          </div>
        `;
      } else {
        // بخش قفل
        return `
          <div class="section-card locked">
            <div class="section-header">
              <span class="section-title">${UI.escapeHtml(s.title)}</span>
              <span class="section-status status-locked">🔒 در انتظار ارائه</span>
            </div>
            <div class="waiting">
              <span class="icon">⏳</span>
              <p>این بخش هنوز باز نشده. ارائه‌کننده در حال آماده‌سازی است.</p>
            </div>
          </div>
        `;
      }
    }).join('');
    
    // نمایش/عدم نمایش المان پایان
    checkAllDone();
  }

  function renderQuestion(question, section) {
    const answered = ProgressStore.getAnsweredQuestions(section.id);
    const isAnswered = !!answered[question.id];
    
    return `
      <div class="question-item ${isAnswered ? 'answered' : ''}" id="q-${question.id}">
        <div class="question-text">${UI.escapeHtml(question.text)}</div>
        ${question.type === 'rating' && question.options ? `
          <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            ${question.options.map(opt => `
              <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                <input type="radio" name="${question.id}" value="${UI.escapeHtml(opt)}">
                <span>${UI.escapeHtml(opt)}</span>
              </label>
            `).join('')}
          </div>
        ` : question.type === 'choice' && question.options ? `
          <select class="answer-input" style="min-height: auto;" id="input-${question.id}">
            <option value="">انتخاب کنید...</option>
            ${question.options.map(opt => `<option value="${UI.escapeHtml(opt)}">${UI.escapeHtml(opt)}</option>`).join('')}
          </select>
        ` : `
          <textarea class="answer-input" id="input-${question.id}" placeholder="پاسخ خود را بنویسید..."></textarea>
        `}
        <button class="btn-submit" onclick="submitAnswer('${question.id}', '${section.id}', '${UI.escapeText(question.text)}')" ${isAnswered ? 'disabled' : ''}>
          ${isAnswered ? '✓ ثبت شد' : 'ارسال پاسخ'}
        </button>
      </div>
    `;
  }

  // تبدیل برای استفاده در JS string
  UI.escapeText = (text) => text.replace(/'/g, "\\'").replace(/"/g, '\\"');

  // ============================================================
  //  ارسال پاسخ
  // ============================================================
  async function submitAnswer(questionId, sectionId, questionText) {
    let answer = '';
    
    const input = document.getElementById('input-' + questionId);
    if (input) {
      answer = input.value.trim();
    } else {
      // radio
      const radios = document.getElementsByName(questionId);
      for (const r of radios) {
        if (r.checked) answer = r.value;
      }
    }
    
    if (!answer) {
      UI.showToast('لطفاً پاسخ را وارد کنید', 'error');
      return;
    }
    
    try {
      await API.post('submit-answer', {
        sectionId,
        questionId,
        questionText,
        answer
      });
      
      ProgressStore.markAnswered(sectionId, questionId);
      UI.showToast('پاسخ ثبت شد', 'success');
      renderSections();
      updateProgress();
      
    } catch (err) {
      UI.showToast('خطا: ' + err.message, 'error');
    }
  }

  // ============================================================
  //  پیشرفت
  // ============================================================
  function updateProgress() {
    const total = questions.filter(q => {
      const section = sections.find(s => s.id === q.sectionId);
      return section && section.active;
    }).length;
    
    const answered = sections.reduce((count, s) => {
      if (!s.active) return count;
      return count + ProgressStore.getAnsweredCount(s.id);
    }, 0);
    
    document.getElementById('progressBar').style.display = total > 0 ? 'flex' : 'none';
    document.getElementById('totalQuestions').textContent = total;
    document.getElementById('answeredCount').textContent = answered;
    
    const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + '%';
  }

  function checkAllDone() {
    // آیا همه سؤالات پاسخ داده‌اند AND همه بخش‌ها بسته شده؟
    const allSectionsDone = sections.every(s => {
      if (!s.active) return true; // بخش‌های قفل = بدون سؤال
      const sectionQuestions = questions.filter(q => q.sectionId === s.id);
      return sectionQuestions.every(q => ProgressStore.getAnsweredQuestions(s.id)[q.id]);
    });
    
    if (allSectionsDone && sections.length > 0 && questions.length > 0) {
      document.getElementById('allDone').style.display = '';
      
      // لینک نظرسنجی
      const surveyLink = document.getElementById('surveyLink');
      surveyLink.href = 'survey.html?scriptUrl=' + encodeURIComponent(scriptUrl);
    }
  }
</script>

</body>
</html>
